# Experiment, not for upstream: how reliable are the gst-mxl-rs tests on a
# GitHub macOS runner, with test domains on disk and on a RAM disk?
name: macOS timing experiment

on:
  push:
    branches:
      - ci-experiment/**

permissions:
  contents: read

jobs:
  proposed_ci_step:
    name: Proposed macOS test step x${{ matrix.rounds }} (attempt ${{ matrix.attempt }})
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2]
        rounds: [5]
    runs-on: macos-26
    env:
      RUST_VERSION: 1.90.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          path: 'mxl'
          submodules: true

      - name: Describe the runner
        run: |
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
          cmake --version | head -n1

      - name: Restore vcpkg cache
        id: vcpkg-cache-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-experiment-macos-26-arm64-${{ hashFiles('mxl/vcpkg.json') }}

      - name: Install build dependencies
        run: brew install cmake gstreamer ninja pkgconf

      - name: Install Rust
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup default "${RUST_VERSION}"

      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg '${{ github.workspace }}/vcpkg'
          '${{ github.workspace }}/vcpkg/bootstrap-vcpkg.sh' -disableMetrics
          printf 'VCPKG_ROOT=%s\n' '${{ github.workspace }}/vcpkg' >> "${GITHUB_ENV}"
          printf 'VCPKG_BINARY_SOURCES=clear;files,${{ github.workspace }}/vcpkg_cache,readwrite\n' >> "${GITHUB_ENV}"
          printf 'VCPKG_DEFAULT_TRIPLET=arm64-osx\n' >> "${GITHUB_ENV}"

      - name: Build the tests
        working-directory: mxl/rust
        run: |
          # The spdlog patch download from github.com fails with 503 now and then.
          for attempt in 1 2 3 4 5; do
            if cargo test --release --all-targets --locked --no-run; then
              exit 0
            fi
            echo "build attempt ${attempt} failed; waiting before the next one"
            sleep 60
          done
          exit 1

      - name: Run the proposed test step repeatedly
        working-directory: mxl/rust
        run: |
          status=0
          for round in $(seq 1 ${{ matrix.rounds }}); do
            log="${RUNNER_TEMP}/round-${round}.log"
            {
              cargo test --release --all-targets --locked --workspace --exclude gst-mxl-rs -- --test-threads=1 &&
              cargo test --release --locked -p gst-mxl-rs --lib -- --test-threads=1
            } > "${log}" 2>&1 || status=1
            passed="$(grep -E '^test result' "${log}" | awk '{p+=$4} END{print p+0}')"
            failed="$(grep -E '^test result' "${log}" | awk '{f+=$6} END{print f+0}')"
            echo "round ${round}: passed ${passed}, failed ${failed}"
            grep -E '^test .* \.\.\. FAILED' "${log}" | sed 's/^/    /' || true
            grep -A2 'panicked at' "${log}" | sed 's/^/    /' || true
          done
          exit "${status}"
